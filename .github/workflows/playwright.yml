name: Checks

on:
  push:
    branches: [main, deployment/staging]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validate Prisma and build the API
        working-directory: backend
        env:
          DATABASE_URL: mysql://prisma:prisma@127.0.0.1:3306/healthcare_db
        run: |
          npx prisma validate
          npx prisma generate
          npm run build
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
